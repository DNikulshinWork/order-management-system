services:
  order-service:
    image: ghcr.io/dnikulshinwork/order-management-system/order-service:latest
    container_name: order-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=order
      - DB_PASSWORD=order123
      - DB_NAME=order_service
    networks:
      - oms-network
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order123
      POSTGRES_DB: order_service
    ports:
      - "5432:5432"
    networks:
      - oms-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  oms-network:
    external: true
    name: oms-network

volumes:
  postgres_data:
