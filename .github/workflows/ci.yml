name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.15.0'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: order
          POSTGRES_PASSWORD: order123
          POSTGRES_DB: order_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://order:order123@localhost:5432/order_service?schema=public" > apps/order-service/.env

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run Prisma migrations
        run: |
          cd apps/order-service
          npx prisma migrate deploy
          cd ../..
        env:
          DATABASE_URL: postgresql://order:order123@localhost:5432/order_service?schema=public

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://order:order123@localhost:5432/order_service?schema=public

      - name: Dependency boundary check
        run: pnpm depcruise
