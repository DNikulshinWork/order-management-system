name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: order
          POSTGRES_PASSWORD: order
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order -d orders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      notifications-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
          POSTGRES_DB: notifications
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U notification -d notifications"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (order-service)
        run: pnpm --filter @repo/order-service exec prisma generate
        env:
          DATABASE_URL: postgresql://order:order@localhost:5432/orders?schema=public

      - name: Apply migrations (order-service)
        run: pnpm --filter @repo/order-service exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://order:order@localhost:5432/orders?schema=public

      - name: Generate Prisma Client (notification-service)
        run: pnpm --filter @repo/notification-service exec prisma generate
        env:
          DATABASE_URL: postgresql://notification:notification@localhost:5433/notifications?schema=public

      - name: Apply migrations (notification-service)
        run: pnpm --filter @repo/notification-service exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://notification:notification@localhost:5433/notifications?schema=public

      - name: Check formatting
        run: pnpm format:check

      - name: Build order-service
        run: pnpm --filter @repo/order-service build
        env:
        DATABASE_URL: postgresql://order:order@localhost:5432/orders?schema=public

      - name: Build notification-service
        run: pnpm --filter @repo/notification-service build
        env:
          DATABASE_URL: postgresql://notification:notification@localhost:5433/notifications?schema=public

      - name: Build api-gateway
        run: pnpm --filter @repo/api-gateway build
        # api-gateway не требует БД (если в будущем понадобится, добавим env)

      # Explicit build for api-gateway (verifies its build script works independently)
      - name: Build API Gateway
        run: pnpm --filter @repo/api-gateway build
        env:
          NODE_ENV: development

      - name: Dependency Cruise
        run: pnpm depcruise

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test order-service
        run: pnpm --filter @repo/order-service test
        env:
          DATABASE_URL: postgresql://order:order@localhost:5432/orders?schema=public

      - name: Test notification-service
        run: pnpm --filter @repo/notification-service test
        env:
          DATABASE_URL: postgresql://notification:notification@localhost:5433/notifications?schema=public

      - name: Test api-gateway
        run: pnpm --filter @repo/api-gateway test
        # api-gateway не требует БД
